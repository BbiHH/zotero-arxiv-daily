zotero:
  user_id: ??? # User ID of your Zotero account.
  api_key: ??? # An Zotero API key with read access.
  include_path: null # A list of glob patterns marking the Zotero collections that should be included. Example: ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # A list of glob patterns marking the Zotero collections that should be excluded. Example: ["2026/ignore/**","archive/**"]
  collection_priority: null # Optional [{pattern, weight}] rules. Each collection is averaged first, then collection means are combined by normalized weights. Example: [{pattern: "research/recent-focus/**", weight: 3}, {pattern: "research/important/**", weight: 2}, {pattern: "research/to-read/**", weight: 1}]

source:
  arxiv:
    category: null # The categories of target arxiv papers. Find the abbr of your research area from [here](https://arxiv.org/category_taxonomy). Example: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: false # Whether to include arXiv cross-list papers in subscribed categories. Example: true
    network:
      connect_timeout: 15 # Seconds allowed to establish each RSS/API/download connection.
      read_timeout: 120 # Seconds allowed without receiving response data.
      max_attempts: 8 # Total attempts within the same workflow run for transient failures.
      retry_base_delay: 15 # Initial retry delay in seconds; subsequent delays use exponential backoff.
      retry_max_delay: 300 # Maximum retry delay in seconds. Numeric Retry-After headers take precedence up to this limit.
      batch_size: 20 # Number of RSS paper IDs requested from the arXiv API together.
      api_delay_seconds: 3 # Minimum delay enforced by arxiv.Client between API requests.
    extraction:
      tar_timeout: 180 # Hard per-paper timeout for source archive download and extraction.
      html_timeout: 180 # Hard per-paper timeout for HTML download and extraction.
      pdf_timeout: 180 # Hard per-paper timeout for PDF download and extraction.
  biorxiv:
    category: null # The categories of target biorxiv papers. Find categories from [here](https://www.biorxiv.org/). Example: ["biochemistry","animal behavior and cognition"]
  medrxiv:
    category: null # The categories of target medrxiv papers. Find categories from [here](https://www.medrxiv.org/) Example: ["psychiatry and clinical psychology", "neurology"]

email:
  sender: ??? # The email account of the SMTP server that sends you email. Example: abc@qq.com
  receiver: ??? # The email account that receives the paper list. Example: abc@outlook.com
  smtp_server: ??? # The SMTP server that sends the email. Ask your email provider (Gmail, QQ, Outlook, ...) for its SMTP server. Example: smtp.qq.com
  smtp_port: ??? # The port of SMTP server. Example: 465
  sender_password: ??? # The password of the sender account. Note that it's not necessarily the password for logging in the e-mail client, but the authentication code for SMTP service. Ask your email provider for this. Example: abcdefghijklmn

llm:
  api:
    key: ??? # API Key of your LLM API. Example: sk-xxx
    base_url: ??? # API URL of your LLM API. Example: https://api.openai.com/v1
  generation_kwargs:
  # Arguments for the LLM API. See [here](https://platform.openai.com/docs/api-reference/chat/create) for more details.
    max_tokens: 16384
    model: ???
  filter:
    enabled: false # Enable the second-stage LLM funnel after embedding recall.
    output_paper_num: 30 # Number of papers kept for TLDR generation and email.
    batch_size: 5 # Papers scored in each LLM request.
    max_batches: 20 # Safety cap; 5 x 20 allows at most 100 embedding candidates.
    max_attempts: 3 # Retries for API failures or invalid/mismatched JSON.
    retry_delay_seconds: 2
    score_step: 5 # LLM scores must be multiples of this value on a 0-100 scale.
    use_json_mode: false # Enable only when the configured OpenAI-compatible API supports response_format.
    prompt_file: config/prompts/paper_filter.txt
    research_profile: |
      Prioritize papers that directly support the user's current research interests.
    screening_requirements: |
      Prefer papers with clear research questions, substantive methods, and useful findings.
      Deprioritize papers that are only broadly related or lack a clear scientific contribution.
    weights:
      llm: 0.7
      embedding: 0.3
    generation_kwargs: # Overrides only for filtering; model is inherited from llm.generation_kwargs.
      temperature: 0
      max_tokens: 800
  language: English # Preferred language for the TL;DR. Example: English

reranker:
  local:
    model: Qwen/Qwen3-Embedding-0.6B # The Hugging Face model name of the local embedding model.
    query_encode_kwargs: # Zotero interest papers are retrieval queries.
      prompt: "Instruct: Given a scientific paper title and abstract, retrieve other scientific papers that are relevant to its research topic, methods, or findings.\nQuery: "
      normalize_embeddings: true
    document_encode_kwargs: # Newly retrieved papers are retrieval documents.
      normalize_embeddings: true
    encode_kwargs: null # Backward compatibility: legacy shared kwargs are applied to both sides; side-specific kwargs above take precedence.
  api:
    key: null # API Key of your embedding model API. Example: sk-xxx
    base_url: null # API URL of your embedding model API. Example: https://api.openai.com/v1
    model: null # The model name of the embedding model. Example: text-embedding-3-large
    batch_size: null # The batch size for embedding API requests. Adjust to match your provider's limit. Example: 64

executor:
  debug: false # Whether to use debug mode. Example: true
  send_empty: false # Whether to send an empty email even if no new papers today. Example: true
  max_paper_num: 100 # Embedding candidates retained before the optional LLM filter. Example: 100
  source: ??? # The sources of papers to retrieve. Example: ['arxiv','biorxiv','medrxiv']
  reranker: local # The reranker to use. Example: 'local' or 'api'
