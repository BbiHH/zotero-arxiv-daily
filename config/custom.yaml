zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]
  ignore_path: null
  collection_priority: null # Or [{pattern: "research/recent-focus/**", weight: 3}, {pattern: "research/important/**", weight: 2}, {pattern: "research/to-read/**", weight: 1}]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  generation_kwargs:
    model: gpt-4o-mini
  filter:
    enabled: true
    output_paper_num: 30
    batch_size: 5
    research_profile: |
      Focus on multimodal and large vision-language model reasoning, especially work
      that studies how models use, inspect, or reason with visual information.
    screening_requirements: |
      Prefer papers with a clear problem, concrete idea or method, and meaningful
      experimental findings. Deprioritize weakly related applications and vague
      incremental work.

source:
  arxiv:
    category: ["cs.AI","cs.CV","cs.LG","cs.CL"]
    # Optional network overrides. Defaults retry transient failures for up to 8 attempts.
    # network:
    #   read_timeout: 120
    #   max_attempts: 8

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
